# https://zenn.dev/cloud_ace/articles/7fe428ac4f25c8
name: deploy-gc-cloudrun

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/functions/**"

permissions:
  contents: read

jobs:
  detect-changed-functions:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.set-functions.outputs.functions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pushに複数コミットが含まれても、変更前のSHAとの差分を取れるよう履歴を残す。
          fetch-depth: 0

      - id: set-functions
        name: Detect Changed Functions
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            paths=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- src/functions/)
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # 手動実行のイベントにはpush前のSHAがなく差分を取れないため、すべてのサービスを候補にする。
            paths=$(git ls-files -- src/functions/)
          else
            # pushのトリガーと同じく、main以外のブランチやタグの内容は本番へデプロイしない。
            echo "manual runs deploy only from refs/heads/main, not $GITHUB_REF"
            paths=""
          fi
          # Dockerfileがないサービスはイメージをビルドできないため除く。削除されたサービスのディレクトリもここで除かれる。
          functions=$(for service in $(echo "$paths" | cut -d/ -f3 | sort -u); do
            if [ -f "src/functions/$service/Dockerfile" ]; then
              echo "$service"
            fi
          done | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "functions to deploy are $functions"
          echo "functions=$functions" >> "$GITHUB_OUTPUT"

  not-deploy-gc-cloudrun:
    runs-on: ubuntu-latest
    needs: detect-changed-functions
    if: needs.detect-changed-functions.outputs.functions == '[]' || needs.detect-changed-functions.outputs.functions == ''
    steps:
      - name: Not Deploy
        run: |
          echo "No changes detected"

  deploy-gc-cloudrun:
    runs-on: ubuntu-latest
    needs: detect-changed-functions
    if: needs.detect-changed-functions.outputs.functions != '[]' && needs.detect-changed-functions.outputs.functions != ''
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changed-functions.outputs.functions) }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GC_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GC_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 379.0.0'

      - name: Build & Push Docker image for ${{ matrix.service }}
        run: |
          gcloud auth configure-docker ${{ secrets.GC_REGION }}-docker.pkg.dev
          IMAGE_URI=${{ secrets.GC_REGION }}-docker.pkg.dev/${{ secrets.GC_PROJECT_ID }}/cloud-run-source-deploy/${{ matrix.service }}:latest
          docker build -t $IMAGE_URI src/functions/${{ matrix.service }}
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Prepare labels
        run: echo "GC_LABELS=managed-by=github-actions,commit-sha=${GITHUB_SHA}" >> $GITHUB_ENV

      # https://cloud.google.com/run/docs/deploy-functions?hl=ja
      - name: Deploy ${{ matrix.service }} to Cloud Run
        run: |
          gcloud run deploy ${{ matrix.service }} \
            --image $IMAGE_URI \
            --region ${{ secrets.GC_REGION }} \
            --project ${{ secrets.GC_PROJECT_ID }} \
            --service-account ${{ secrets.GC_SERVICE_ACCOUNT }} \
            --labels=$GC_LABELS
