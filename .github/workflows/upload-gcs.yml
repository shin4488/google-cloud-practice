name: Upload SQLs to GCS

on:
  push:
    branches:
      - main
    paths:
      - "src/queries/**/*.sql"

jobs:
  upload-to-gcs:
    runs-on: ubuntu-latest
    env:
      CLOUDSDK_METRICS_ENVIRONMENT: datacloud.codex

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          # pushに複数コミットが含まれても、変更前のSHAとの差分を取れるよう履歴を残す。
          fetch-depth: 0

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ secrets.GC_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GC_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      with:
        version: '>= 379.0.0'

    - name: Get changed and deleted SQL files
      id: changed_files
      # 差分ファイルリスト取得（A:追加、M:変更、D:削除のみ）
      run: |
        (git diff --name-status ${{ github.event.before }} ${{ github.sha }} | grep -E '^(A|M|D|R.*)\s+src/queries/.*\.sql$' || true) > changed_sql_status.txt
        cat changed_sql_status.txt

    # authが発行するWIF認証情報を使うため、gsutilではなくgcloud storageで操作する。
    - name: Process add/update/delete/rename SQL files to GCS
      run: |
        while IFS=$'\t' read -r status old new; do
          case "$status" in
            A|M)
              # 追加・修正→アップロード
              dest_path=$(echo "$old" | sed 's|^src/queries/||')
              gcloud storage cp "$old" "gs://${{ secrets.GCS_BUCKET_NAME }}/queries/${dest_path}"
              ;;
            D)
              # 削除→GCSからも削除
              dest_path=$(echo "$old" | sed 's|^src/queries/||')
              gcloud storage rm "gs://${{ secrets.GCS_BUCKET_NAME }}/queries/${dest_path}" || true
              ;;
            R*)
              # リネーム→新ファイルをアップロード、旧ファイルを削除
              old_dest=$(echo "$old" | sed 's|^src/queries/||')
              new_dest=$(echo "$new" | sed 's|^src/queries/||')
              gcloud storage cp "$new" "gs://${{ secrets.GCS_BUCKET_NAME }}/queries/${new_dest}"
              gcloud storage rm "gs://${{ secrets.GCS_BUCKET_NAME }}/queries/${old_dest}" || true
              ;;
          esac
        done < changed_sql_status.txt

    # 削除エラーを成功と誤認しないよう、検証用2オブジェクトの404を確認する。
    - name: Verify deleted fixtures
      env:
        GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      shell: python
      run: |
        import os
        import subprocess
        import urllib.error
        import urllib.parse
        import urllib.request
        from pathlib import Path

        expected = {f"src/queries/_verification/pr7/{name}.sql" for name in ("first", "second")}
        deleted = {line.split("\t", 1)[1] for line in Path("changed_sql_status.txt").read_text().splitlines() if line.startswith("D\t")}
        if deleted != expected:
            raise SystemExit("Expected exactly the two fixture deletions")
        token = subprocess.check_output(["gcloud", "auth", "print-access-token"], text=True).strip()
        bucket = urllib.parse.quote(os.environ["GCS_BUCKET_NAME"], safe="")
        for file in sorted(expected):
            object_name = urllib.parse.quote("queries/" + file.removeprefix("src/queries/"), safe="")
            request = urllib.request.Request(
                f"https://storage.googleapis.com/storage/v1/b/{bucket}/o/{object_name}",
                headers={"Authorization": f"Bearer {token}"},
            )
            try:
                with urllib.request.urlopen(request, timeout=30) as response:
                    raise SystemExit(f"Object still exists: {file}")
            except urllib.error.HTTPError as error:
                if error.code != 404:
                    raise SystemExit(f"Deletion verification failed: HTTP {error.code}") from None
            except urllib.error.URLError:
                raise SystemExit("Deletion verification failed: network error") from None
            print(f"Verified deleted object (HTTP 404): {file}")
