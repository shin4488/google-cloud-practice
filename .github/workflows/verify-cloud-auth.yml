name: Verify Cloud authentication without resource operations
on:
  push:
    branches: [chore/actions-update-20260922]
    paths: [.github/workflows/verify-cloud-auth.yml]
permissions:
  contents: read
  id-token: write
jobs:
  verify-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDSDK_METRICS_ENVIRONMENT: datacloud.codex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GC_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GC_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GC_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 379.0.0'
      - name: Check credential configuration without printing identifiers
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess
          accounts = json.loads(subprocess.check_output(['gcloud', 'auth', 'list', '--format=json']))
          config = json.loads(subprocess.check_output(['gcloud', 'config', 'list', '--format=json']))
          assert any(a.get('status') == 'ACTIVE' for a in accounts), 'No active credentials'
          assert config.get('core', {}).get('project'), 'No configured project'
          print('Active credentials and project are configured.')
          PY
      - name: Verify WIF token exchange without accessing resources
        shell: bash
        run: |
          gcloud auth print-access-token > /dev/null
          echo 'WIF token exchange succeeded. No storage or deployment operations performed.'
