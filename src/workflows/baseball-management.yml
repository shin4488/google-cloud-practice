main:
    steps:
    - select_teams:
        call: exec_query
        args:
            # src/queries/ 以下の SQL は、同じ相対パスでバケットの queries/ 以下にアップロードされる。
            bucket_path: "queries/baseball/baseball_team_selection.sql"
        result: query_result
    - log_bq:
        call: sys.log
        args:
            data: ${query_result.rows}

exec_query:
    params: [bucket_path]
    steps:
        - init:
            assign:
            - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
            # SQL のアップロード先のバケット名は、デプロイ時にユーザー定義の環境変数で設定する。
            - bucket_name: ${sys.get_env("GCS_BUCKET_NAME")}

        - get_query:
            call: http.get
            args:
                url: ${"https://storage.googleapis.com/download/storage/v1/b/" + bucket_name + "/o/" + text.url_encode(bucket_path)}
                headers:
                    Content-Type: "text/plain"
                auth:
                    type: OAuth2
                query:
                    alt: media
            result: obj

        - exec_query:
            call: googleapis.bigquery.v2.jobs.query
            args:
                projectId: ${project_id}
                body:
                    query: ${text.replace_all(text.decode(obj.body), "\n", " ")}
                    useLegacySql: false
            result: query_result

        - return_result:
            return: ${query_result}
